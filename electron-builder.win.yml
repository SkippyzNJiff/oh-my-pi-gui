appId: sh.omp.gui
productName: omp
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/omp.exe
    to: omp.exe
asar: true
compression: maximum

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # no signing for now — users may see SmartScreen on first run
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: omp

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish:
  provider: github
  owner: nornzach
  repo: oh-my-pi-gui
